              - generic [ref=e190]: "83.4"
          - paragraph [ref=e191]: Three-phase running back capable of stressing defenses with big-play speed and untapped pass-catching value. Love shared carries but was the heartbeat of Notre Dame’s offense over the last two years. He runs with a fierce tempo and processes the front with adequate eyes to find entry points and burst through them. Urgency works in his favor, but he’ll occasionally miss open lanes when he gets too deep too quickly. Outstanding speed erases pursuit angles to the corner and helps him pull away from tacklers once he opens his gait. He’s live-legged with violent cuts in segmented bursts that can elude tacklers but slow his momentum. He’s not a pile-mover but he runs through contact and squeezes out extra yards as a committed finisher. He’s a talented route runner and pass catcher who can work from the slot and mismatch linebackers. Love is a three-down, scheme-independent player who would benefit from a complementary back to preserve his big-play ability.
          - generic [ref=e192]:
            - generic [ref=e193]:
              - generic [ref=e194]: Strengths
              - paragraph [ref=e195]: • Highly productive, with 2,497 yards rushing and 35 touchdowns in the last two seasons. • Workhorse mentality but only saw 20 or more carries three times during career. • Urgent but shortens his stride to improve control as a move-maker. • Instant reacceleration helps him escape rallying defenders. • Speed to outflank and corner as an outside runner. • Rockets through interior entry points to stress missed run fits. • State champion sprinter in high school. • Runs with forward lean and is intentional as a run finisher. • Ball carriage can be a little loose but he almost never fumbles. • Can align in the slot and run routes like a receiver. • Capable of hurting defenses as a three-level pass catcher. • Protects with consistent readiness to square up and scrap with blitzers.
            - generic [ref=e196]:
              - generic [ref=e197]: Weaknesses
              - paragraph [ref=e198]: • Slight indecisiveness can slow his departure. • Probes to find the crease instead of setting one up. • Cuts and transitions are choppy, sapping his momentum. • Inconsistent spatial awareness as an inside runner. • Doesn’t feature pile-moving lower-body power. • Leaves feet and goes airborne too willingly.
