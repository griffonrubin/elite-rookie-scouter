                - generic [ref=e194]: "65.3"
            - paragraph [ref=e195]: Ascending “Z” receiver who continues to step out from the shadow of Ohio State teammate Jeremiah Smith. Tate has good size but would benefit from more play strength. He builds momentum quickly on intermediate and deep routes, utilizing speed and tempo to pressure cornerbacks. He can win over the top on verticals or separate over the first two levels with route savvy and separation burst. Tate tracks throws at top speed and makes his adjustments to run under them. He combines timing, body control and catch radius to dominate air space and consistently lands on the winning side of contested catches. Pass catching comes effortlessly with soft, strong hands and he consistently works back on throws to keep ballhawks from hawking. Tate displays rare polish for a player his age and has the talent to become a heralded pro within his first three seasons.
            - generic [ref=e196]:
              - generic [ref=e197]:
                - generic [ref=e198]: Strengths
                - paragraph [ref=e199]: • Plus agility, speed and body control. • Slips press and gets into stride quickly for vertical advantage. • Consistent route runner who leverages defenders out of position. • Route tempo and play speed overwhelms lesser corners. • No wasted motion; smooth turnover and a burst to separate. • Works back on most throws, eliminating playmaking angles for defenders. • Good spatial awareness against zone. • Impressive win rate when contested. • Outstanding ball tracking and catch focus downfield. • Dominates air space with elite high-point timing and hand strength. • Late fade adjustments prevent face-guarders from reading his hands.
              - generic [ref=e200]:
                - generic [ref=e201]: Weaknesses
                - paragraph [ref=e202]: • Lacks ideal build and frame as a WR1 candidate. • Long press corners can limit some early release advantages. • Chest/pads rise, giving break clues on stop routes and comebacks. • Average run block strain by NFL standards. • Missed three games in 2025 with a calf strain.
